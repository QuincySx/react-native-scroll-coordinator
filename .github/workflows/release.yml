name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable --mode=skip-build
      - run: yarn check
      - run: node scripts/verify-publish.mjs
      - run: mkdir package-artifact
      - run: npm pack --ignore-scripts --pack-destination package-artifact
      - run: mv package-artifact/react-native-scroll-coordinator-*.tgz package-artifact/package.tgz
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: npm-package
          path: package-artifact/*.tgz
          if-no-files-found: error
          retention-days: 1

  npm:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: package-artifact
      - run: npm publish ./package-artifact/package.tgz --ignore-scripts --access public --tag alpha --provenance

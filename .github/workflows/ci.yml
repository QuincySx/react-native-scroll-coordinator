name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable --mode=skip-build
      - run: yarn typecheck
      - run: yarn test
      - run: yarn test:release
      - run: yarn test:tarball
      - run: yarn workspace CoordinatorExample test --runInBand
      - run: yarn workspace CoordinatorExample build:web
      - run: yarn workspace CoordinatorExample lint

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - run: corepack enable
      - run: yarn install --immutable --mode=skip-build
      - run: >-
          ./example/android/gradlew -p example/android
          :react-native-scroll-coordinator:testDebugUnitTest
          :react-native-scroll-coordinator:lintDebug
          :app:assembleDebug

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler: 2.7.2
          working-directory: example
      - run: corepack enable
      - run: yarn install --immutable --mode=skip-build
      - run: bundle install
        working-directory: example
      - run: bundle exec pod install
        working-directory: example/ios
      - run: >-
          xcodebuild
          -workspace CoordinatorExample.xcworkspace
          -scheme CoordinatorExample
          -sdk iphonesimulator
          -configuration Debug
          CODE_SIGNING_ALLOWED=NO
          build
        working-directory: example/ios

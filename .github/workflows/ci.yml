name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: corepack enable
      - run: yarn install --immutable --mode=skip-build
      - run: yarn typecheck
      - run: yarn test
      - run: yarn test:release
      - run: yarn test:tarball
      - run: yarn workspace CoordinatorExample test --runInBand
      - run: yarn workspace CoordinatorExample build:web
      - run: yarn workspace CoordinatorExample lint

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - run: corepack enable
      - run: yarn install --immutable --mode=skip-build
      - run: >-
          ./example/android/gradlew -p example/android
          :react-native-scroll-coordinator:testDebugUnitTest
          :react-native-scroll-coordinator:lintDebug
          :app:assembleDebug

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: corepack enable
      - run: yarn install --immutable --mode=skip-build
      - run: bundle install
        working-directory: example
      - run: bundle exec pod install
        working-directory: example/ios
      - run: >-
          xcodebuild
          -workspace CoordinatorExample.xcworkspace
          -scheme CoordinatorExample
          -sdk iphonesimulator
          -configuration Debug
          CODE_SIGNING_ALLOWED=NO
          build
        working-directory: example/ios
